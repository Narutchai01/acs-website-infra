services:
  servers:
    ports:
      - "${APP_PORT}:${APP_PORT}"
    # platform: linux/amd64
    container_name: acs-core-service-prod
    image: ghcr.io/asc-base/acs-core-service:1.3.1
    restart: unless-stopped
    environment:
      APP_PORT: ${APP_PORT}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET}
      DATABASE_URL: ${DATABASE_URL}
      HTTPONLY: ${HTTPONLY}
      SECURE: ${SECURE}
      ENVIRONMENT: prod
      APP_HOST: ${APP_HOST}
      SECRET_JWT: ${SECRET_JWT}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS}
      ALLOW_ORIGIN: ${ALLOW_ORIGIN}
      SKIP_MIGRATE: ${SKIP_MIGRATE}
      RUN_SEED: ${RUN_SEED}
    networks:
      - acs-prod-network

networks:
  acs-prod-network:
    external: true
    name: acs-prod-network
